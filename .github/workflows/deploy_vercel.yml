name: Trigger Vercel Deployments on Push

on:
  push:
    branches:
      - saas-integration

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NexAlpha Omega Vercel Project
        run: |
          echo "Triggering NexAlpha Omega deployment..."
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_54hwsc2kFj4i6dmTuShGjD1vUzWv/N6PDrie5CX"

      - name: Trigger NexAlpha Main Vercel Project
        run: |
          echo "Triggering NexAlpha Main deployment..."
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_1oz38Q5DE3HgeGbzefIJzP5SEht2/mWlueu202T"
